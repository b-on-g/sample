name: GTK CI

permissions: write-all

on:
    workflow_dispatch:
    push:
        branches:
            - gtk-ci
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  token: ${{ secrets.GH_PAT }}
                  package: bog/gtk
                  modules: demo
