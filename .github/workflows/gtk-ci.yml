name: GTK CI

permissions: write-all

on:
    workflow_dispatch:
    push:
        branches:
            - gtk-ci
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  token: ${{ secrets.GH_PAT }}
                  package: bog/gtk
                  modules: demo

            - name: Smoke import outside browser
              run: node -e "globalThis.self=globalThis; import('./bog/gtk/demo/-/web.mjs').then(m=>console.log(Object.keys(m).slice(0,20)))"

            - uses: actions/upload-artifact@v4
              with:
                  name: gtk-demo-bundle
                  path: bog/gtk/demo/-
