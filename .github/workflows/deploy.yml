name: Deploy GTK

permissions: write-all

on:
    workflow_dispatch:
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: hyoo-ru/mam_build@master2
              with:
                  token: ${{ secrets.GH_PAT }}
                  package: bog/gtk
                  modules: demo

            - name: Smoke import outside browser
              run: node -e "globalThis.self=globalThis; self.addEventListener=()=>{}; self.removeEventListener=()=>{}; import('./bog/gtk/demo/-/web.mjs')"

            - name: Install GTK4 runtime
              run: sudo apt-get update && sudo apt-get install -y gjs gir1.2-gtk-4.0 xvfb

            - name: Native GTK4 smoke test
              run: xvfb-run -a gjs -m bog/gtk/demo/native.mjs --smoke

            - uses: JamesIves/github-pages-deploy-action@4.1.7
              with:
                  branch: gh-pages
                  folder: bog/gtk/site
