<h1>$bog_gtk</h1>
<p>Experimental native GTK4 renderer for $mol/MAM.</p>
<p>The UI is rendered with real GTK4 widgets through GJS. No WebView is used.</p>
<pre>view.tree → $bog_gtk_view → $bog_gtk_host → GJS → GTK4</pre>
<p>GitHub Actions validates MAM audit/tests and a native GTK4 smoke run before deployment.</p>
